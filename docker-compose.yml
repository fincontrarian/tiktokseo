# Local dependencies for Findable. Start with: docker compose up -d
# Then: cp .env.example .env && npm install && npm run setup && npm run dev
services:
  postgres:
    image: postgres:16
    container_name: findable-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: findable
    ports:
      - "5432:5432"
    volumes:
      - findable-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: findable-redis
    ports:
      - "6379:6379"

volumes:
  findable-pg-data:
